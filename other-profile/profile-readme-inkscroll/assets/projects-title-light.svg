<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 68" width="900" height="68" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua','DejaVu Serif',serif"><style>
.sway{transform-origin:710px 8px;animation:sway 11s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-.45deg)}to{transform:rotate(.45deg)}}
.pfall{animation:pfall linear infinite}
@keyframes pfall{from{transform:translateY(-30px)}to{transform:translateY(560px)}}
.psway{transform-box:fill-box;transform-origin:center;animation:psway ease-in-out infinite alternate}
@keyframes psway{from{transform:translateX(-26px) rotate(-30deg)}to{transform:translateX(26px) rotate(30deg)}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 9s ease-out infinite;opacity:0}
@keyframes rip{0%{transform:scale(.2);opacity:0}15%{opacity:.7}100%{transform:scale(1.6);opacity:0}}
.sun{animation:sun 12s ease-in-out infinite}
@keyframes sun{0%,100%{opacity:.05}50%{opacity:.34}}
.mist{animation:mist 40s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.wave{animation:wave 26s linear infinite}
@keyframes wave{to{transform:translateX(-48px)}}
.pulse{animation:pl 2.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sway,.pfall,.psway,.rip,.sun,.mist,.wave,.pulse{animation:none}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e9cd"/><stop offset="1" stop-color="#e4d4a9"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#b9a77a" stop-opacity=".28"/></radialGradient>
<radialGradient id="sunglow"><stop offset="0" stop-color="#ff6a4a" stop-opacity=".9"/><stop offset="1" stop-color="#ff6a4a" stop-opacity="0"/></radialGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .4" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .15  0 0 0 .5 0"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .13 0"/></filter>
<filter id="rough" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wob" x="-4%" y="-20%" width="108%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="paint" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/><feColorMatrix in="d" type="saturate" values=".92"/></filter>
<pattern id="sei" width="24" height="12" patternUnits="userSpaceOnUse"><g fill="none" stroke="#8ea5b2" stroke-width=".8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="4"/><circle cx="0" cy="6" r="10"/><circle cx="0" cy="6" r="7"/><circle cx="0" cy="6" r="4"/><circle cx="24" cy="6" r="10"/><circle cx="24" cy="6" r="7"/><circle cx="24" cy="6" r="4"/></g></pattern>
</defs><rect width="900" height="68" fill="url(#bg)"/><rect width="900" height="68" filter="url(#paper)"/><rect width="900" height="68" filter="url(#grain)"/><rect width="900" height="68" fill="url(#vig)"/><g transform="rotate(0 72 32)" filter="url(#rough)"><rect x="60" y="20" width="24" height="24" fill="#bf2a22"/><rect x="61.68" y="21.68" width="20.64" height="20.64" fill="none" stroke="#f6edd2" stroke-opacity=".75" stroke-width="1.0"/><text x="72.0" y="37.28" font-size="16" font-family="'KaiTi','STKaiti','Kaiti SC','AR PL UKai CN','Noto Serif SC','Songti SC','SimSun',serif" font-weight="700" text-anchor="middle" fill="#f6edd2">肆</text></g><text x="96" y="39" font-size="15" font-weight="700" fill="#26211b" letter-spacing="3" rotate="0.4 0.3 1.1 -0.3 0.6 -0.3 0.2 0.4 -0.4 -1 -0.1 0.5 0.2 -0.1 0.3 -0.8 -0.8 -0.4 0.8 -0.7 -0.9 -1" dy="0.8 0 -0.1 -1.6 1 -0.3 0.2 -0.8 0.1 0.5 -0.4 0.5 -0.9 0.1 1.2 -0.6 0.2 0.4 -0.8 -0.6 1.5 -0.4" >SELECTED LIVE PROJECTS</text><path d="M59.5 53.3L79.6 53.7L100.1 54.3L119.9 54.4L139.5 54.6L159.9 55.1L180.1 55.3L199.9 54.9L220.3 55.7L239.9 54.8L260 55.2L280.3 55.3L300 55.1L319.9 54.5L339.6 55.1L360.3 54.2L380.4 54.2L380.4 53.8L360.3 53.7L339.6 54.4L319.9 53.6L300 54.2L280.3 54.1L260 54L239.9 53.5L220.4 54L199.9 53.1L180 53.5L159.9 53.4L139.5 52.4L120 52L100.2 51.9L79.7 51L59.5 51.1Z" fill="#29486f" opacity="0.75" filter="url(#wob)"/><rect x="720" y="19" width="136" height="26" fill="#f8f0d6" stroke="#23201c" stroke-opacity=".65" filter="url(#wob)"/><circle class="pulse" cx="737" cy="32" r="3.4" fill="#287a4e"/><text x="748" y="36" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,Menlo,monospace" font-size="10" font-weight="700" letter-spacing="1" fill="#26211b">6 DEPLOYED APPS</text><path d="M.5 0V68M899.5 0V68" stroke="#b9a77a"/></svg>