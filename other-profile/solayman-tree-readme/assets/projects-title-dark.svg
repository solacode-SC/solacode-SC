<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Selected Live Projects">
    <defs>
        <linearGradient id="ptBg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#09111c"/>
            <stop offset="100%" stop-color="#0e1a2b"/>
        </linearGradient>
    </defs>
    <style>
.font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; }
.font-serif { font-family: "Cinzel", "Playfair Display", Georgia, serif; }
.font-mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } }
</style>
    <rect width="1200" height="96" rx="16" fill="url(#ptBg)"/>
    <rect width="1200" height="96" rx="16" fill="none" stroke="rgba(86, 207, 225, 0.28)" stroke-width="1.2"/>
    <g transform="translate(48, 38)">
        <text x="0" y="0" fill="#e0a96d" font-size="11.5" font-weight="700" letter-spacing="1.8" class="font-mono">DEPLOYED PRODUCTION SYSTEMS</text>
        <text x="0" y="28" fill="#f2f7fc" font-size="24" font-weight="700" class="font-serif">Selected Live Projects</text>
        <line x1="330" y1="18" x2="950" y2="18" stroke="rgba(86, 207, 225, 0.14)" stroke-width="1.2"/>
        <g transform="translate(966, 2)">
            <rect width="144" height="30" rx="15" fill="#0b1f29" stroke="#56cfe1" stroke-opacity=".6"/>
            <circle cx="18" cy="15" r="4.2" fill="#72efdd" class="pulse"/>
            <text x="31" y="19" fill="#f2f7fc" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">6 LIVE APPS</text>
        </g>
    </g>
</svg>